<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf8f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyNurse">
<title>StudyNurse v0.2.3</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brandrow">
      <div class="brand">StudyNurse</div>
      <span class="modebadge" id="modeBadge">VIEW</span>
      <span class="spacer"></span>
      <button class="btn btn-soft" id="editBtn">편집</button>
      <button class="btn btn-primary" id="saveBtn" hidden>저장</button>
    </div>
    <div class="searchrow">
      <input class="search" id="searchInput" placeholder="개념 · 단어 · 기출 검색">
    </div>
  </div>
  <div class="navbox"><div class="tabs" id="tabs"></div></div>
  <div id="content"></div>
</div>

<button class="fab" id="addCardBtn" title="새 카드">＋</button>
<div class="modal" id="cardModal">
 <div class="modalbox">
  <h3>새 개념 카드</h3>
  <div class="field"><label>제목</label><input id="newTitle"></div>
  <div class="field"><label>키워드 (쉼표 구분)</label><input id="newKeywords"></div>
  <div class="field"><label>개념 (줄바꿈 = 항목)</label><textarea id="newBullets"></textarea></div>
  <button class="btn btn-pink" id="createCardBtn">추가</button>
  <button class="btn btn-soft" id="closeCardBtn">취소</button>
 </div>
</div>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js"></script>
</body>
</html>
