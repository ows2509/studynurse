<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf8f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyNurse">
<title>StudyNurse v0.5.4</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brandrow">
      <div class="brand">StudyNurse <small id="appVersion">v0.5.4</small></div>
      <span class="modebadge" id="modeBadge">VIEW</span>
      <span class="envbadge" id="envBadge">PROD</span>
      <span class="spacer"></span>
      <div class="top-actions" id="topActions">
        <button class="btn btn-soft" id="diagBtn">진단</button><button class="btn btn-soft" id="quizBtn">🎯 퀴즈</button><button class="btn btn-soft" id="editBtn">편집</button>
        <button class="btn btn-soft" id="autoCardBtn" hidden>⚡ 자동정리</button>
        <button class="btn btn-primary" id="saveBtn" hidden>저장</button>
      </div>
    </div>
    <div class="searchrow">
      <input class="search" id="searchInput" placeholder="개념 · 단어 · 기출 · HTML 내용 검색">
    </div>
  </div>

  <div class="edit-dock" id="editDock" hidden>
    <div class="edit-dock-actions" id="editDockActions"></div>
    <div class="rich-toolbar" id="richToolbar" hidden>
      <b>서식</b>
      <button id="rtBold">B</button>
      <button id="rtUnderline"><u>U</u></button>
      <button id="rtHighlight">형광</button>
      <button id="rtBlack">검정</button>
      <button id="rtPink">핑크</button>
      <button id="rtClear">초기화</button>
    </div>
  </div>
  <div class="navbox">
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="content"></div>
</div>

<button class="fab" id="addCardBtn" title="새 카드">＋</button>
<input type="file" id="imageInput" accept="image/*" hidden>

<div class="modal" id="cardModal">
 <div class="modalbox">
  <h3>새 개념 카드</h3>
  <div class="field"><label>제목</label><input id="newTitle"></div>
  <div class="field"><label>키워드 (쉼표 구분)</label><input id="newKeywords"></div>
  <div class="field"><label>개념 (줄바꿈 = 문단)</label><textarea id="newBullets"></textarea></div>
  <button class="btn btn-pink" id="createCardBtn">추가</button>
  <button class="btn btn-soft" id="closeCardBtn">취소</button>
 </div>
</div>

<div class="modal" id="categoryModal">
 <div class="modalbox">
  <h3 id="categoryModalTitle">새 카테고리</h3>
  <div class="field"><label>표시 이름</label><input id="categoryName" placeholder="예: Neuro"></div>
  <div class="field"><label>설명 (선택)</label><input id="categorySubtitle" placeholder="예: Neurology"></div>
  <button class="btn btn-pink" id="saveCategoryBtn">추가</button>
  <button class="btn btn-soft" id="closeCategoryBtn">취소</button>
 </div>
</div>

<div class="modal" id="htmlModal">
 <div class="modalbox html-modalbox">
  <h3>HTML 직접 편집</h3>
  <p class="small">script / iframe / onClick / javascript URL 등 실행형 코드는 자동 제거됩니다.</p>
  <div class="field">
    <label>HTML</label>
    <textarea id="htmlEditor" class="code-editor" spellcheck="false"></textarea>
  </div>
  <div class="field">
    <label>미리보기</label>
    <div id="htmlPreview" class="html-preview"></div>
  </div>
  <button class="btn btn-soft" id="previewHtmlBtn">미리보기</button>
  <button class="btn btn-pink" id="applyHtmlBtn">적용</button>
  <button class="btn btn-soft" id="closeHtmlBtn">취소</button>
 </div>
</div>

<div class="modal" id="imageModal">
 <div class="modalbox image-modalbox">
  <h3>이미지 업로드 설정</h3>
  <div class="image-preview-shell">
    <img id="imagePreview" alt="업로드 이미지 미리보기">
  </div>

  <div class="field">
    <label>해상도 / 품질</label>
    <select id="imageProfile">
      <option value="original">원본 유지</option>
      <option value="high">고화질 · 최대 2560px · 90%</option>
      <option value="standard" selected>기본 · 최대 1600px · 84%</option>
      <option value="compact">용량 절약 · 최대 1024px · 74%</option>
    </select>
  </div>

  <div class="crop-grid">
    <div class="field">
      <label>왼쪽 자르기 <span id="cropLeftValue">0%</span></label>
      <input type="range" id="cropLeft" min="0" max="45" value="0">
    </div>
    <div class="field">
      <label>오른쪽 자르기 <span id="cropRightValue">0%</span></label>
      <input type="range" id="cropRight" min="0" max="45" value="0">
    </div>
    <div class="field">
      <label>위 자르기 <span id="cropTopValue">0%</span></label>
      <input type="range" id="cropTop" min="0" max="45" value="0">
    </div>
    <div class="field">
      <label>아래 자르기 <span id="cropBottomValue">0%</span></label>
      <input type="range" id="cropBottom" min="0" max="45" value="0">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>회전</label>
      <select id="imageRotate">
        <option value="0">0°</option>
        <option value="90">90°</option>
        <option value="180">180°</option>
        <option value="270">270°</option>
      </select>
    </div>
    <div class="field">
      <label>화면 표시 크기</label>
      <select id="imageDisplayWidth">
        <option value="100">100%</option>
        <option value="75" selected>75%</option>
        <option value="50">50%</option>
        <option value="25">25%</option>
      </select>
    </div>
  </div>

  <div class="image-info" id="imageInfo">이미지를 분석 중입니다.</div>

  <button class="btn btn-pink" id="uploadImageBtn">업로드</button>
  <button class="btn btn-soft" id="cancelImageBtn">취소</button>
 </div>
</div>


<div class="modal" id="autoCardModal">
  <div class="modalbox auto-modalbox">
    <h3>⚡ 텍스트 자동정리</h3>
    <p class="small">
      여러 주제를 &lt;주제명&gt;, # 주제명, ## 주제명 형식으로 구분하면 각각 카드로 생성합니다.
      VOCAB/단어, TRANS/TRANSLATION/해석/번역, O/X 표기도 자동 분류합니다.
    </p>

    <div class="field">
      <label>원문 붙여넣기</label>
      <textarea id="autoCardInput" class="auto-card-input" placeholder="<Anaphylactic Shock(아나필락시스쇼크)>
-Cz: 벌 침적(Bee sting)
-❎ B-blocker나 혈관확장제 금지
🅾️ (1st) 에피네프린 IM
VOCAB: anaphylaxis - 아나필락시스
번역: administer epinephrine IM - 에피네프린을 근육주사한다

<Immune Thrombocytopenic Purpura (ITP)>
-자가항체가 혈소판을 파괴
-❎ safety razor 말고 electric razor
🅾️ 변완화제 가능"></textarea>
    </div>

    <div class="auto-actions">
      <button class="btn btn-soft" id="previewAutoCardsBtn">미리보기</button>
      <button class="btn btn-pink" id="createAutoCardsBtn" disabled>카드 생성</button>
      <button class="btn btn-soft" id="closeAutoCardsBtn">취소</button>
    </div>

    <div id="autoPreviewSummary" class="auto-preview-summary"></div>
    <div id="autoPreviewList" class="auto-preview-list"></div>
  </div>
</div>

<div class="modal" id="quizModal"><div class="modalbox"><h3>🎯 랜덤 문제</h3><div id="quizSetup"><div class="field"><label>유형</label><select id="quizType"><option value="mixed">랜덤</option><option value="ox">O/X</option><option value="mcq">4지선다</option></select></div><div class="field"><label>범위</label><select id="quizScope"><option value="category">현재 카테고리</option><option value="all">전체</option></select></div><div class="field"><label>문제 수</label><select id="quizCount"><option>5</option><option selected>10</option><option>20</option></select></div><button class="btn btn-pink" id="startQuizBtn">시작</button><button class="btn btn-soft" id="closeQuizBtn">닫기</button></div><div id="quizPlay" hidden><div id="quizProgress"></div><div id="quizSource"></div><div class="quiz-question" id="quizQuestion"></div><div id="quizOptions"></div><div class="quiz-answer" id="quizAnswer" hidden></div><button class="btn btn-soft" id="revealQuizBtn">정답 확인</button><button class="btn btn-primary" id="nextQuizBtn" hidden>다음</button><button class="btn btn-soft" id="exitQuizBtn">종료</button></div><div id="quizResult" hidden></div></div></div>
<div class="modal" id="diagModal">
  <div class="modalbox">
    <h3>StudyNurse 진단</h3>
    <div class="diag-grid" id="diagGrid"></div>
    <div class="diag-actions">
      <button class="btn btn-soft" id="diagRefreshBtn">다시 검사</button>
      <button class="btn btn-soft" id="diagCloudBtn">Supabase 읽기 테스트</button>
      <button class="btn btn-soft" id="diagCloseBtn">닫기</button>
    </div>
    <pre class="diag-log" id="diagLog"></pre>
  </div>
</div>

<script src="./config.js"></script>
<script src="./config.dev.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js"></script>
</body>
</html>
